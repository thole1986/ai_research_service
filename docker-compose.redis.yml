# Standalone service. See docs/compose-services.vi.md for startup order.
name: ${COMPOSE_PROJECT_NAME:-ai_research_service}
services:
  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    ports:
    - 127.0.0.1:${REDIS_HOST_PORT:-6380}:6379
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  redis-data: null
