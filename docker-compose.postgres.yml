# Standalone service. See docs/compose-services.vi.md for startup order.
name: ${COMPOSE_PROJECT_NAME:-ai_research_service}
services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-company_ai}
      POSTGRES_USER: ${POSTGRES_USER:-company_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
    - 127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data: null
