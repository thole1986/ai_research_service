[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-ai"
version = "0.1.0"
description = "Checkpointed company research with conservative LLM recovery"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "crewai>=1.0,<2",
  "celery[redis]>=5.5,<6", "sqlalchemy[asyncio]>=2.0,<2.1", "alembic>=1.15,<2",
  "aiosqlite>=0.21,<1", "asyncpg>=0.30,<1",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "openai>=2,<3",
]

[project.optional-dependencies]
observability = ["langfuse>=4,<6"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/company_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["manual: explicit real-provider smoke test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = [".uv-cache", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

