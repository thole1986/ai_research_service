# Standalone service. See docs/compose-services.vi.md for startup order.
name: ${COMPOSE_PROJECT_NAME:-ai_research_service}
services:
  api:
    extends:
      file: docker-compose.common.yml
      service: app
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
    - 127.0.0.1:8000:8000
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready',
        timeout=5)
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 20s
volumes:
  app-data: null
